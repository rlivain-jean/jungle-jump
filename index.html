<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jungle Jump</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
  :root {
    --leaf: #1f5c3a;
    --leaf-deep: #0f2a1d;
    --banana: #ffd23f;
    --monkey: #b5743a;
    --frog: #49b85a;
    --cream: #fff8e7;
    --font: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--leaf-deep); overflow: hidden; font-family: var(--font); color: var(--cream); }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5vh; background: radial-gradient(ellipse at center, rgba(15,42,29,.82), rgba(15,42,29,.96)); text-align: center; }
  .overlay[hidden] { display: none; }
  h1 { margin: 0; font-size: 9vh; line-height: 1; font-weight: 800; color: var(--banana); text-shadow: 0 .6vh 0 #a3761a; letter-spacing: .02em; }
  .sub { margin: 0; font-size: 2.8vh; opacity: .85; }
  .cards { display: flex; gap: 5vw; }
  .card { background: var(--cream); color: var(--leaf-deep); border-radius: 3vh; padding: 2.5vh 3vh; display: flex; flex-direction: column; align-items: center; gap: 1vh; min-width: 26vh; border: .8vh solid transparent; transition: border-color .2s; }
  .card.p1 { border-color: var(--monkey); }
  .card.p2 { border-color: var(--frog); }
  .card h2 { margin: 0; font-size: 3.6vh; }
  .card .qr svg { width: 24vh; height: 24vh; display: block; }
  .status { font-size: 2.6vh; font-weight: 700; padding: .3vh 1.6vh; border-radius: 99px; background: #e9e1cc; }
  .status.on { background: var(--frog); color: #fff; }
  .status.ready { background: var(--banana); color: var(--leaf-deep); }
  .hint { font-size: 2.6vh; }
  .hint kbd { font-family: inherit; background: rgba(255,255,255,.15); border-radius: .6vh; padding: 0 .8vh; }
  .room { font-size: 2vh; opacity: .6; }
  button.sound { font: inherit; font-size: 2.2vh; border: 0; border-radius: 99px; padding: .6vh 2vh; background: rgba(255,255,255,.15); color: var(--cream); cursor: pointer; }
  #results h1 { font-size: 10vh; }
  .podium { display: flex; gap: 5vw; font-size: 3.4vh; }
  .podium div { background: rgba(255,255,255,.08); border-radius: 3vh; padding: 2vh 4vh; }
  .podium b { display: block; font-size: 5vh; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>

<div id="lobby" class="overlay">
  <h1>Jungle Jump</h1>
  <p class="sub">Run on the spot to run. Jump for real to jump. First to the waterfall wins!</p>
  <div class="cards">
    <div class="card p1"><h2>🐒 Player 1 · Monkey</h2><div class="qr" id="qr1"></div><span class="status" id="st1">Scan to join</span></div>
    <div class="card p2"><h2>🐸 Player 2 · Frog</h2><div class="qr" id="qr2"></div><span class="status" id="st2">Scan to join</span></div>
  </div>
  <p class="hint" id="startHint">Everyone jump to start · or press <kbd>Enter</kbd></p>
  <button class="sound" id="soundBtn" type="button">🔊 Turn sound on</button>
  <p class="room" id="roomLine">Connecting…</p>
</div>

<div id="results" class="overlay" hidden>
  <h1 id="winner">Monkey wins!</h1>
  <div class="podium" id="podium"></div>
  <p class="hint">Jump to play again · or press <kbd>Enter</kbd></p>
</div>

<script src="vendor/peerjs.min.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script>
// ---------- constants ----------
const W = 1920, H = 1080, LANE = H / 2, GROUND = LANE - 92;
const PX = 48;            // pixels per metre
const RACE = 250;         // metres to the finish
const MAXV = 10;          // metres per second at full effort
const GRAV = 2300, JUMPV = 980;
const PLAYER_X = 380;

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const $ = id => document.getElementById(id);

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const now = () => performance.now() / 1000;
function hash(i) { let x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- sound ----------
let actx = null;
function unlockAudio() { if (!actx) { try { actx = new AudioContext(); } catch (e) {} } if (actx && actx.state === 'suspended') actx.resume(); $('soundBtn').textContent = '🔊 Sound is on'; }
function beep(freq, dur = .12, type = 'square', vol = .08, slide = 0) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  jump: () => beep(380, .18, 'square', .06, 2),
  banana: () => { beep(880, .08, 'triangle', .1); setTimeout(() => beep(1320, .1, 'triangle', .1), 70); },
  bonk: () => beep(160, .25, 'sawtooth', .08, .5),
  tick: () => beep(520, .15, 'triangle', .12),
  go: () => beep(1040, .4, 'triangle', .12),
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .25, 'triangle', .12), i * 140)),
};
$('soundBtn').onclick = unlockAudio;
addEventListener('pointerdown', unlockAudio);

// ---------- course ----------
let course;
function makeCourse(seed) {
  const r = mulberry32(seed), obstacles = [], bananas = [];
  let m = 20;
  while (m < RACE - 15) {
    const type = r() < .55 ? 'log' : 'rock';
    obstacles.push({ m, type, w: type === 'log' ? 74 : 62, h: type === 'log' ? 48 : 60, hit: [false, false] });
    if (r() < .5) bananas.push({ m, y: 190, got: [false, false] });
    else if (r() < .7) for (let k = 0; k < 3; k++) bananas.push({ m: m + 4 + k * 1.3, y: 60, got: [false, false] });
    m += 9 + r() * 8;
  }
  return { obstacles, bananas };
}

// ---------- players ----------
const players = [0, 1].map(i => ({
  i, name: i ? 'Frog' : 'Monkey', kind: i ? 'frog' : 'monkey',
  conn: null, connected: false, kb: false, ready: false,
}));
function resetPlayer(p) {
  Object.assign(p, { dist: 0, speed: 0, run: 0, lastInput: 0, y: 0, vy: 0, stumble: 0, jumpQ: 0, fruit: 0, finished: null, flash: 0 });
}
players.forEach(resetPlayer);
const active = p => p.connected || p.kb;

// ---------- game state ----------
let phase = 'lobby', phaseT = 0, raceT = 0, firstFinish = null;
let popups = [];

function startCountdown() {
  if (!players.some(active)) return;
  course = makeCourse((Math.random() * 1e9) | 0);
  players.forEach(resetPlayer);
  players.forEach(p => p.inRace = active(p));
  popups = []; firstFinish = null;
  phase = 'countdown'; phaseT = now();
  $('lobby').hidden = true; $('results').hidden = true;
  sfx.tick();
}

function jump(p) {
  if (phase === 'lobby') { p.ready = true; updateLobby(); maybeAutoStart(); return; }
  if (phase === 'results') { if (now() - phaseT > 2) startCountdown(); return; }
  if (phase === 'race') p.jumpQ = now() + .25;
}

function maybeAutoStart() {
  const act = players.filter(active);
  if (act.length && act.every(p => p.ready)) startCountdown();
}

// ---------- keyboard ----------
const keys = {};
addEventListener('keydown', e => {
  unlockAudio();
  if (keys[e.code]) return; keys[e.code] = true;
  if (e.code === 'Enter') { if (phase === 'lobby') startCountdown(); else if (phase === 'results') startCountdown(); }
  if (e.code === 'KeyW') { players[0].kb = true; updateLobby(); jump(players[0]); }
  if (e.code === 'ArrowUp') { players[1].kb = true; updateLobby(); jump(players[1]); }
  if (e.code === 'KeyD') { players[0].kb = true; updateLobby(); }
  if (e.code === 'ArrowRight') { players[1].kb = true; updateLobby(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });

// ---------- networking (phones connect via PeerJS) ----------
let peer, room;
function newRoom() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; room = Array.from({ length: 4 }, () => a[Math.random() * a.length | 0]).join(''); try { localStorage.setItem('jj-room', room); } catch (e) {} }
try { room = localStorage.getItem('jj-room'); } catch (e) {}
if (!room) newRoom();

function controllerUrl(n) { const u = new URL('controller.html', location.href); u.search = `?room=${room}&p=${n}`; return u.href; }
function drawQRs() {
  [1, 2].forEach(n => {
    const q = qrcode(0, 'M'); q.addData(controllerUrl(n)); q.make();
    $('qr' + n).innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  });
}

function connectPeer() {
  drawQRs();
  $('roomLine').textContent = `Connecting… (room ${room})`;
  peer = new Peer('jungle-jump-' + room);
  peer.on('open', () => { $('roomLine').textContent = `Room ${room} · ${location.host || 'local file'}`; });
  peer.on('connection', conn => {
    const idx = conn.metadata && conn.metadata.p == 2 ? 1 : 0, p = players[idx];
    conn.on('open', () => {
      if (p.conn && p.conn !== conn) { try { p.conn.close(); } catch (e) {} }
      p.conn = conn; p.connected = true; p.ready = false;
      conn.send({ t: 'hi', name: p.name, kind: p.kind });
      updateLobby();
    });
    conn.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (d.t === 'r') { p.run = clamp(+d.v || 0, 0, 1); p.lastInput = now(); }
      else if (d.t === 'j') jump(p);
    });
    conn.on('close', () => { if (p.conn === conn) { p.conn = null; p.connected = false; updateLobby(); } });
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { peer.destroy(); newRoom(); setTimeout(connectPeer, 300); }
    else if (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error') { $('roomLine').textContent = 'No connection to the pairing server. Retrying…'; setTimeout(() => { try { peer.destroy(); } catch (x) {} connectPeer(); }, 3000); }
  });
}
connectPeer();

function updateLobby() {
  players.forEach((p, i) => {
    const el = $('st' + (i + 1));
    el.className = 'status' + (p.ready ? ' ready' : active(p) ? ' on' : '');
    el.textContent = p.ready ? 'Ready!' : p.connected ? 'Connected · jump when ready' : p.kb ? 'Keyboard · press jump' : 'Scan to join';
  });
}

// ---------- update ----------
function updatePlayer(p, dt, t) {
  // keyboard run input
  if (p.kb && keys[p.i ? 'ArrowRight' : 'KeyD']) { p.run = 1; p.lastInput = t; }
  if (t - p.lastInput > .5) p.run *= Math.exp(-dt * 4);

  if (phase !== 'race' || !p.inRace) return;
  const done = p.finished !== null;
  p.stumble = Math.max(0, p.stumble - dt);
  p.flash = Math.max(0, p.flash - dt);

  let target = done ? 0 : p.stumble > 0 ? 0 : p.run * MAXV;
  p.speed += (target - p.speed) * Math.min(1, dt * (target > p.speed ? 2.5 : 4));
  if (p.y > 0 && !done) p.speed = Math.max(p.speed, 4);

  // jump
  if (p.jumpQ > t && p.y === 0 && p.stumble === 0 && !done) { p.vy = JUMPV; p.jumpQ = 0; sfx.jump(); }
  if (p.y > 0 || p.vy > 0) { p.vy -= GRAV * dt; p.y = Math.max(0, p.y + p.vy * dt); if (p.y === 0) p.vy = 0; }

  p.dist += p.speed * dt;
  const px = p.dist * PX;

  // obstacles
  for (const o of course.obstacles) {
    if (o.hit[p.i]) continue;
    if (Math.abs(px - o.m * PX) < 26 + o.w / 2 && p.y < o.h - 8) {
      o.hit[p.i] = true; p.stumble = .9; p.speed = 0; p.flash = .9; sfx.bonk();
      popups.push({ lane: p.i, m: o.m, y: 150, text: 'Oops!', t });
    }
  }
  // bananas
  for (const b of course.bananas) {
    if (b.got[p.i]) continue;
    if (Math.abs(px - b.m * PX) < 50 && Math.abs(p.y + 60 - b.y) < 70) {
      b.got[p.i] = true; p.fruit++; sfx.banana();
      popups.push({ lane: p.i, m: b.m, y: b.y + 40, text: '+1', t });
    }
  }
  if (!done && p.dist >= RACE) {
    p.finished = raceT; if (firstFinish === null) { firstFinish = t; sfx.win(); }
    popups.push({ lane: p.i, m: RACE, y: 260, text: firstFinish === t ? 'WINNER!' : 'Finished!', t });
  }
}

function update(dt) {
  const t = now();
  if (phase === 'countdown' && t - phaseT >= 3) { phase = 'race'; phaseT = t; raceT = 0; sfx.go(); }
  else if (phase === 'countdown') { const s = Math.ceil(3 - (t - phaseT)); if (s !== update.lastS) { update.lastS = s; if (s < 3) sfx.tick(); } }
  if (phase === 'race') raceT += dt;
  players.forEach(p => updatePlayer(p, dt, t));
  if (phase === 'race') {
    const racers = players.filter(p => p.inRace);
    if (racers.every(p => p.finished !== null) || (firstFinish !== null && t - firstFinish > 12)) showResults();
  }
  popups = popups.filter(p => t - p.t < 1.2);
}

function showResults() {
  phase = 'results'; phaseT = now();
  const racers = players.filter(p => p.inRace).sort((a, b) => (a.finished ?? 1e9) - (b.finished ?? 1e9) || b.dist - a.dist);
  const w = racers[0];
  $('winner').textContent = racers.length > 1 ? `${w.kind === 'frog' ? '🐸' : '🐒'} ${w.name} wins!` : 'You made it!';
  $('podium').innerHTML = racers.map(p => `<div>${p.kind === 'frog' ? '🐸' : '🐒'} ${p.name}<b>${p.finished !== null ? p.finished.toFixed(1) + ' s' : Math.round(p.dist) + ' m'}</b>🍌 ${p.fruit} bananas</div>`).join('');
  $('results').hidden = false;
  players.forEach(p => p.ready = false);
}

// ---------- drawing ----------
function drawBackground(cam) {
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, '#7fcaf0'); sky.addColorStop(1, '#d6f2dc');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, LANE);
  // far hills
  ctx.fillStyle = '#7fb98a'; ctx.beginPath(); ctx.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 16) { const k = x + cam * .15; ctx.lineTo(x, 250 + Math.sin(k * .005) * 34 + Math.sin(k * .013) * 16); }
  ctx.lineTo(W, GROUND); ctx.fill();
  // jungle trees
  const sp = 240, pc = cam * .5, i0 = Math.floor(pc / sp) - 1;
  for (let i = i0; i < i0 + W / sp + 3; i++) {
    const x = i * sp - pc + hash(i) * 90, h = 150 + hash(i + 9) * 90;
    ctx.fillStyle = '#5b3a1e'; ctx.fillRect(x - 10, GROUND - h, 20, h);
    ctx.fillStyle = hash(i + 3) > .5 ? '#2f7d45' : '#3a8f50';
    [[0, -h, 62], [-46, -h + 22, 46], [46, -h + 18, 48], [0, -h - 40, 44]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(x + dx, GROUND + dy, r, 0, 7); ctx.fill(); });
    if (hash(i + 5) > .55) { ctx.strokeStyle = '#2b6b3b'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x + 30, GROUND - h + 10); ctx.quadraticCurveTo(x + 40, GROUND - h + 80, x + 28, GROUND - h + 130); ctx.stroke(); }
  }
  // ground
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(0, GROUND, W, LANE - GROUND);
  ctx.fillStyle = '#4caf50'; ctx.fillRect(0, GROUND - 6, W, 18);
  const gs = 70, g0 = Math.floor(cam / gs);
  for (let i = g0; i < g0 + W / gs + 2; i++) {
    const x = i * gs - cam;
    ctx.fillStyle = '#4caf50'; ctx.beginPath(); ctx.moveTo(x, GROUND + 12); ctx.lineTo(x + 10, GROUND - 14 - hash(i) * 10); ctx.lineTo(x + 20, GROUND + 12); ctx.fill();
    if (hash(i + 2) > .6) { ctx.fillStyle = '#6e4622'; ctx.beginPath(); ctx.ellipse(x + 35, GROUND + 50 + hash(i) * 20, 10, 6, 0, 0, 7); ctx.fill(); }
  }
}

function drawFinish(cam) {
  const x = RACE * PX - cam;
  if (x < -300 || x > W + 300) return;
  // waterfall behind the finish
  ctx.fillStyle = '#6b7f86'; ctx.fillRect(x + 80, 60, 260, GROUND - 60);
  ctx.fillStyle = '#9fe0ff';
  ctx.fillRect(x + 110, 60, 200, GROUND - 60);
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  for (let k = 0; k < 6; k++) { const yy = ((performance.now() / 4 + k * 60) % (GROUND - 60)) + 60; ctx.fillRect(x + 120 + k * 30, yy, 8, 40); }
  // flag poles + checkered banner
  ctx.fillStyle = '#5b3a1e'; ctx.fillRect(x - 6, GROUND - 220, 12, 220); ctx.fillRect(x + 54, GROUND - 220, 12, 220);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 6; c++) { ctx.fillStyle = (r + c) % 2 ? '#222' : '#fff'; ctx.fillRect(x - 6 + c * 12, GROUND - 220 + r * 12, 12, 12); }
}

function drawObstacle(o, x) {
  if (o.type === 'log') {
    ctx.fillStyle = '#7a4a22'; roundRect(x - o.w / 2, GROUND - o.h, o.w, o.h, 14); ctx.fill();
    ctx.fillStyle = '#c99a63'; ctx.beginPath(); ctx.ellipse(x + o.w / 2 - 10, GROUND - o.h / 2, 12, o.h / 2 - 3, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(x + o.w / 2 - 10, GROUND - o.h / 2, 6, o.h / 4, 0, 0, 7); ctx.stroke();
  } else {
    ctx.fillStyle = '#8d8f94'; ctx.beginPath();
    ctx.moveTo(x - o.w / 2, GROUND); ctx.lineTo(x - o.w / 2 + 8, GROUND - o.h * .7); ctx.lineTo(x - 6, GROUND - o.h); ctx.lineTo(x + o.w / 2 - 6, GROUND - o.h * .75); ctx.lineTo(x + o.w / 2, GROUND); ctx.fill();
    ctx.fillStyle = '#a9abb0'; ctx.beginPath(); ctx.moveTo(x - 6, GROUND - o.h); ctx.lineTo(x + 10, GROUND - o.h * .6); ctx.lineTo(x - o.w / 2 + 8, GROUND - o.h * .7); ctx.fill();
  }
}

function drawBanana(x, y) {
  ctx.save(); ctx.translate(x, GROUND - y); ctx.rotate(-.4);
  ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#a3761a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, -18, 22, .3, Math.PI - .3); ctx.arc(0, -30, 26, Math.PI - .45, .45, true); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function limb(x1, y1, x2, y2, w, c) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

function drawMonkey(phase, air) {
  const s = air ? .7 : Math.sin(phase), fur = '#8b5a2b', skin = '#efcfa6';
  ctx.strokeStyle = '#6b3e1f'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-18, -42); ctx.quadraticCurveTo(-62, -48, -56, -86); ctx.quadraticCurveTo(-50, -106, -34, -96); ctx.stroke();
  limb(-8, -30, -8 + s * 16, -2, 11, '#6b3e1f');
  limb(8, -30, 8 - s * 16, -2, 11, fur);
  limb(-4, -60, -18 - s * 14, -36, 9, '#6b3e1f');
  ctx.fillStyle = fur; ctx.beginPath(); ctx.ellipse(0, -50, 25, 29, 0, 0, 7); ctx.fill();
  ctx.fillStyle = skin; ctx.beginPath(); ctx.ellipse(5, -46, 14, 19, 0, 0, 7); ctx.fill();
  limb(4, -60, 22 + s * 14, -38, 9, fur);
  ctx.fillStyle = fur; ctx.beginPath(); ctx.arc(-14, -98, 10, 0, 7); ctx.arc(30, -98, 10, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(8, -94, 26, 0, 7); ctx.fill();
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(-14, -98, 5, 0, 7); ctx.arc(30, -98, 5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12, -88, 18, 15, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(6, -95, 3.6, 0, 7); ctx.arc(19, -95, 3.6, 0, 7); ctx.fill();
  ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(13, -86, 7, .2, Math.PI - .2); ctx.stroke();
}

function drawFrog(phase, air) {
  const s = air ? 1 : Math.abs(Math.sin(phase)), g = '#3f9e4d', light = '#cde8a8';
  limb(-14, -24, -26 - s * 10, -2, 12, '#2f7d3b'); limb(-26 - s * 10, -2, -6, -2, 10, '#2f7d3b');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, -42, 34, 30, 0, 0, 7); ctx.fill();
  ctx.fillStyle = light; ctx.beginPath(); ctx.ellipse(8, -34, 20, 18, 0, 0, 7); ctx.fill();
  limb(14, -24, 26 + s * 10, -2, 12, g); limb(26 + s * 10, -2, 40, -2, 10, g);
  limb(18, -44, 34, -26 + s * 6, 9, g);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(-6, -72, 14, 0, 7); ctx.arc(22, -72, 14, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-6, -73, 9, 0, 7); ctx.arc(22, -73, 9, 0, 7); ctx.fill();
  ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(-3, -73, 4.5, 0, 7); ctx.arc(25, -73, 4.5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#1f5c2a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(10, -52, 14, .3, Math.PI - .3); ctx.stroke();
}

function drawPlayer(p, t) {
  const x = PLAYER_X, by = GROUND - p.y;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x, GROUND + 4, 34 - Math.min(p.y, 150) / 10, 8, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(x, by);
  if (p.stumble > 0) ctx.rotate(-.35 * Math.sin(p.stumble * 12));
  if (p.flash > 0 && Math.sin(t * 40) > 0) ctx.globalAlpha = .45;
  ctx.scale(1.25, 1.25);
  (p.kind === 'frog' ? drawFrog : drawMonkey)(p.dist * 1.1, p.y > 0);
  ctx.restore();
  if (p.stumble > 0) for (let k = 0; k < 3; k++) { const a = t * 6 + k * 2.1; ctx.fillStyle = '#ffd23f'; ctx.font = '28px sans-serif'; ctx.fillText('★', x - 10 + Math.cos(a) * 34, by - 150 + Math.sin(a) * 10); }
}

function drawHud(p, other, t) {
  // progress track with both racers
  const x0 = 520, x1 = W - 120, y = 44;
  ctx.fillStyle = 'rgba(15,42,29,.55)'; roundRect(x0 - 20, y - 22, x1 - x0 + 40, 44, 22); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x0, y - 3, x1 - x0, 6);
  ctx.font = '30px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🏁', x1 + 2, y);
  if (other.inRace) { ctx.globalAlpha = .5; ctx.fillText(other.kind === 'frog' ? '🐸' : '🐒', x0 + (x1 - x0) * clamp(other.dist / RACE, 0, 1), y); ctx.globalAlpha = 1; }
  ctx.fillText(p.kind === 'frog' ? '🐸' : '🐒', x0 + (x1 - x0) * clamp(p.dist / RACE, 0, 1), y);
  // name + bananas
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(15,42,29,.55)'; roundRect(24, 22, 440, 46, 23); ctx.fill();
  ctx.fillStyle = '#fff8e7'; ctx.font = '700 30px "Baloo 2", sans-serif';
  ctx.fillText(`${p.name}  ·  🍌 ${p.fruit}  ·  ${Math.min(RACE, Math.round(p.dist))} m`, 44, 46);
  // effort meter (how hard they're running)
  const mh = 200, mx = W - 60, my = 110;
  ctx.fillStyle = 'rgba(15,42,29,.55)'; roundRect(mx - 18, my, 36, mh, 18); ctx.fill();
  const lv = clamp(p.run, 0, 1); ctx.fillStyle = lv > .7 ? '#ffd23f' : '#7ee08a';
  roundRect(mx - 12, my + 6 + (mh - 12) * (1 - lv), 24, (mh - 12) * lv, 12); ctx.fill();
  ctx.textAlign = 'center'; ctx.font = '700 20px "Baloo 2", sans-serif'; ctx.fillStyle = '#fff8e7'; ctx.fillText('RUN', mx, my + mh + 20);
}

function drawLane(p, other, t) {
  ctx.save(); ctx.translate(0, p.i * LANE);
  ctx.beginPath(); ctx.rect(0, 0, W, LANE); ctx.clip();
  const cam = (p.dist || 0) * PX - PLAYER_X;
  drawBackground(cam);
  drawFinish(cam);
  if (course) {
    for (const o of course.obstacles) { const x = o.m * PX - cam; if (x > -100 && x < W + 100) drawObstacle(o, x); }
    for (const b of course.bananas) { if (b.got[p.i]) continue; const x = b.m * PX - cam; if (x > -50 && x < W + 50) drawBanana(x, b.y + Math.sin(t * 4 + b.m) * 6); }
  }
  drawPlayer(p, t);
  for (const pu of popups) if (pu.lane === p.i) {
    const k = (t - pu.t) / 1.2; ctx.globalAlpha = 1 - k; ctx.fillStyle = '#fff8e7'; ctx.strokeStyle = '#0f2a1d'; ctx.lineWidth = 6;
    ctx.font = '800 54px "Baloo 2", sans-serif'; ctx.textAlign = 'center';
    const x = pu.m * PX - cam, y = GROUND - pu.y - k * 60; ctx.strokeText(pu.text, x, y); ctx.fillText(pu.text, x, y); ctx.globalAlpha = 1;
  }
  if (phase !== 'lobby') drawHud(p, other, t);
  if ((phase === 'race' || phase === 'countdown') && !p.inRace) {
    ctx.fillStyle = 'rgba(15,42,29,.7)'; ctx.fillRect(0, 0, W, LANE);
    ctx.fillStyle = '#fff8e7'; ctx.font = '700 48px "Baloo 2", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`${p.name} is sitting this one out`, W / 2, LANE / 2);
  }
  ctx.restore();
}

function draw(t) {
  ctx.clearRect(0, 0, W, H);
  drawLane(players[0], players[1], t);
  drawLane(players[1], players[0], t);
  // vine divider
  ctx.fillStyle = '#1f5c3a'; ctx.fillRect(0, LANE - 6, W, 12);
  for (let x = 0; x < W; x += 60) { ctx.fillStyle = '#3a8f50'; ctx.beginPath(); ctx.ellipse(x + 30, LANE, 18, 8, (x / 60) % 2 ? .5 : -.5, 0, 7); ctx.fill(); }
  if (phase === 'countdown') {
    const s = Math.ceil(3 - (t - phaseT));
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#0f2a1d'; ctx.lineWidth = 14; ctx.font = '800 260px "Baloo 2", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeText(s, W / 2, H / 2); ctx.fillText(s, W / 2, H / 2);
  } else if (phase === 'race' && t - phaseT < .8) {
    ctx.globalAlpha = 1 - (t - phaseT) / .8; ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#0f2a1d'; ctx.lineWidth = 14;
    ctx.font = '800 240px "Baloo 2", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeText('GO!', W / 2, H / 2); ctx.fillText('GO!', W / 2, H / 2); ctx.globalAlpha = 1;
  }
  ctx.textBaseline = 'alphabetic';
}

// ---------- loop ----------
let last = now();
function frame() {
  const t = now(), dt = Math.min(.05, t - last); last = t;
  update(dt); draw(t);
  requestAnimationFrame(frame);
}
updateLobby();
requestAnimationFrame(frame);
</script>
</body>
</html>
